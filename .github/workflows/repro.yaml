name: Caller-side subsystem configuration
on: [push]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc-patched: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Select C++ toolchain patch
        if: matrix.cc-patched
        shell: pwsh
        run: |
          'single_version_override(module_name = "rules_cc", patches = ["//:rules_cc.patch"], patch_strip = 1)' | Add-Content MODULE.bazel
      - name: Install Bazelisk
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-windows-amd64.exe -OutFile "$env:RUNNER_TEMP/bazel.exe"
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test target features with unmodified rules_rust
        shell: pwsh
        env:
          CC_PATCHED: ${{ matrix.cc-patched }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:CC_PATCHED -eq 'true') {
            ./policy.ps1 -ExpectedStampedSubsystem 2
          } else {
            $output = bazel --output_user_root=C:/b --ignore_all_rc_files build --enable_bzlmod //:stamped //:unstamped 2>&1
            $code = $LASTEXITCODE
            $output | Write-Host
            if ($code -eq 0) { throw 'Caller-side disable unexpectedly succeeded without rules_cc patch' }
            if (($output -join "`n") -notmatch 'linker_subsystem_flag|cpp-link-executable') {
              throw 'Build failed for an unexpected reason'
            }
            Write-Host 'Stock toolchain rejects caller-side feature disabling'
            exit 0
          }
