name: Windows subsystem policy
on: [push]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rules-rust: ["0.70.0", "main-83d85cce"]
        patched: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Select toolchain patches
        shell: pwsh
        env:
          RULES_RUST: ${{ matrix.rules-rust }}
          PATCHED: ${{ matrix.patched }}
        run: |
          if ($env:RULES_RUST -eq 'main-83d85cce') {
            $patch = if ($env:PATCHED -eq 'true') { 'patches = ["//:rules_rust.patch"], patch_strip = 1,' } else { '' }
            @"
          archive_override(
              module_name = "rules_rust",
              urls = ["https://github.com/bazelbuild/rules_rust/archive/83d85cce0ab56b42a7466d8b34f4e52949d2d064.tar.gz"],
              strip_prefix = "rules_rust-83d85cce0ab56b42a7466d8b34f4e52949d2d064",
              $patch
          )
          "@ | Add-Content MODULE.bazel
          } elseif ($env:PATCHED -eq 'true') {
            'single_version_override(module_name = "rules_rust", patches = ["//:rules_rust.patch"], patch_strip = 1)' | Add-Content MODULE.bazel
          }
          if ($env:PATCHED -eq 'true') {
            'single_version_override(module_name = "rules_cc", patches = ["//:rules_cc.patch"], patch_strip = 1)' | Add-Content MODULE.bazel
          }
      - name: Install Bazelisk
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-windows-amd64.exe -OutFile "$env:RUNNER_TEMP/bazel.exe"
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Verify subsystem policy
        shell: pwsh
        env:
          PATCHED: ${{ matrix.patched }}
        run: |
          $expected = if ($env:PATCHED -eq 'true') { 2 } else { 3 }
          ./policy.ps1 -ExpectedStampedSubsystem $expected
